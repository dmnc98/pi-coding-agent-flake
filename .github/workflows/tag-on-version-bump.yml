name: Tag on version bump

on:
  push:
    branches: [main]
    paths:
      - default.nix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-on-version-bump
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag if version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' default.nix \
            | head -1 \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          if [ -z "$version" ]; then
            echo "::error::Could not extract version from default.nix"
            exit 1
          fi

          tag="v${version}"
          echo "Detected version: ${version} (tag: ${tag})"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            exit 0
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "pi-coding-agent ${version}" \
            --generate-notes
