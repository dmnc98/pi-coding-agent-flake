name: Auto-bump pi-coding-agent

on:
  schedule:
    # Mondays 06:17 UTC. Offset from :00 to avoid GitHub cron contention.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: auto-bump-pi-coding-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest version from npm
        id: resolve
        run: |
          set -euo pipefail

          current=$(grep -oE 'version = "[0-9]+\.[0-9]+\.[0-9]+"' default.nix \
            | head -1 \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          latest=$(curl -fsSL https://registry.npmjs.org/@earendil-works/pi-coding-agent \
            | nix run nixpkgs#jq -- -r '."dist-tags".latest')

          echo "Current: ${current}"
          echo "Latest:  ${latest}"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and regenerate vendored package-lock.json
        if: steps.resolve.outputs.changed == 'true'
        env:
          CURRENT: ${{ steps.resolve.outputs.current }}
          LATEST: ${{ steps.resolve.outputs.latest }}
        run: |
          set -euo pipefail

          # Bump version and clear src.hash + npmDepsHash for rotation.
          sed -i "s|version = \"${CURRENT}\"|version = \"${LATEST}\"|" default.nix
          sed -i -E 's|hash = "sha256-[A-Za-z0-9+/=]+"|hash = lib.fakeHash|' default.nix
          sed -i -E 's|npmDepsHash = "sha256-[A-Za-z0-9+/=]+"|npmDepsHash = lib.fakeHash|' default.nix

          # Regenerate vendored lockfile from the new tarball. This is what
          # makes the build deterministic across consumers: no network resolver
          # at build time, no spontaneous drift between bumps.
          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT

          curl -fsSL \
            -o "$workdir/pi.tgz" \
            "https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-${LATEST}.tgz"
          tar -xzf "$workdir/pi.tgz" -C "$workdir"

          pushd "$workdir/package" >/dev/null
          rm -f npm-shrinkwrap.json package-lock.json
          # npm 10 (bundled with nodejs_22) crashes in Arborist's peer-set
          # resolution on upstream's vitest 4 devDependency:
          #   TypeError: Cannot read properties of null (reading 'edgesOut')
          # npm 11 (nodejs_24) resolves it fine and still writes
          # lockfileVersion 3, which buildNpmPackage consumes. The package
          # itself is still built against nodejs_22 — this only swaps the
          # resolver used to generate the lockfile.
          nix shell nixpkgs#nodejs_24 -c npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          popd >/dev/null

          cp "$workdir/package/package-lock.json" package-lock.json
          echo "Regenerated package-lock.json for ${LATEST}."

      - name: Rotate src.hash and npmDepsHash
        if: steps.resolve.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # Replace `<attr> = lib.fakeHash` with the real hash captured from
          # the FOD failure during a build. src.hash (the tarball FOD) is
          # checked first by Nix, so its mismatch surfaces before
          # npmDepsHash's — we rotate in that dependency order.
          rotate() {
            local attr="$1"

            set +e
            local out
            out=$(nix build .#pi-coding-agent 2>&1)
            set -e
            echo "$out"

            local got
            got=$(printf '%s\n' "$out" \
              | awk '/got:[[:space:]]+sha256-/ { print $NF; exit }')

            if [ -z "$got" ]; then
              echo "::error::Could not extract ${attr} from build output." >&2
              return 1
            fi

            sed -i "s|${attr} = lib.fakeHash|${attr} = \"$got\"|" default.nix
            echo "New ${attr}: $got"
          }

          rotate hash
          rotate npmDepsHash

      - name: Verify build
        if: steps.resolve.outputs.changed == 'true'
        run: nix build .#pi-coding-agent

      - name: Open PR
        if: steps.resolve.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/bump-pi-coding-agent
          delete-branch: true
          title: "Bump pi-coding-agent to ${{ steps.resolve.outputs.latest }}"
          commit-message: "Bump pi-coding-agent to ${{ steps.resolve.outputs.latest }}"
          body: |
            Automated version bump to **${{ steps.resolve.outputs.latest }}**.

            - `version` bumped from ${{ steps.resolve.outputs.current }} to ${{ steps.resolve.outputs.latest }}.
            - `package-lock.json` regenerated from the new tarball (lockfileVersion 3, vendored in-tree).
            - `src.hash` and `npmDepsHash` rotated via `lib.fakeHash`.
            - Final `nix build .#pi-coding-agent` passed in CI.
