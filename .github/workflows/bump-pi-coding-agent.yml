name: Auto-bump pi-coding-agent

on:
  schedule:
    # Mondays 06:17 UTC. Offset from :00 to avoid GitHub cron contention.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: auto-bump-pi-coding-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Bump version, src.hash, npmDepsHash via nix-update
        run: |
          nix run nixpkgs#nix-update -- --flake pi-coding-agent

      - name: Rotate packageLock outputHash and npmDepsHash
        run: |
          set -euo pipefail

          if git diff --quiet -- default.nix; then
            echo "nix-update made no changes; nothing to rotate."
            exit 0
          fi

          # Helper: replace `<attr> = "sha256-..."` with lib.fakeHash, run the
          # build, capture the `got:` hash from the first FOD failure, and
          # substitute it back. The packageLock FOD is built first (it's a
          # build input), so its hash mismatch surfaces before npmDepsHash's —
          # which is why we rotate them in dependency order.
          rotate() {
            local attr="$1"
            sed -i -E "s|${attr} = \"sha256-[A-Za-z0-9+/=]+\"|${attr} = lib.fakeHash|" default.nix

            local out
            set +e
            out=$(nix build .#pi-coding-agent 2>&1)
            set -e
            echo "$out"

            local got
            got=$(printf '%s\n' "$out" \
              | awk '/got:[[:space:]]+sha256-/ { print $NF; exit }')

            if [ -z "$got" ]; then
              echo "::error::Could not extract ${attr} from build output." >&2
              return 1
            fi

            sed -i "s|${attr} = lib.fakeHash|${attr} = \"$got\"|" default.nix
            echo "New ${attr}: $got"
          }

          # `outputHash` (the packageLock FOD) must come first: nix-update may
          # have written a wrong npmDepsHash if the packageLock FOD failed
          # before the npm-deps FOD during its detection build. Fixing
          # packageLock first lets the npm-deps mismatch surface cleanly.
          rotate outputHash
          rotate npmDepsHash

      - name: Verify build
        run: |
          if git diff --quiet -- default.nix; then
            echo "No changes; skipping verification."
            exit 0
          fi
          nix build .#pi-coding-agent

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/bump-pi-coding-agent
          delete-branch: true
          title: "Bump pi-coding-agent"
          commit-message: "Bump pi-coding-agent"
          body: |
            Automated version bump.

            - `nix-update` refreshed `version`, `src.hash`, and `npmDepsHash`.
            - `packageLock.outputHash` rotated by re-running the FOD with `lib.fakeHash`.
            - Final `nix build .#pi-coding-agent` passed in CI.
